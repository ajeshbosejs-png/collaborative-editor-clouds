<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editor | Collaborative Document</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
        body {min-height:100vh;background:linear-gradient(135deg, #1d2671, #c33764);color:#fff;display:flex;flex-direction:column;}
        
        /* HEADER */
        .header {display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:rgba(0,0,0,0.2);border-radius:10px;}
        .header h2 {font-weight:500;}
        .header .actions {display:flex;gap:15px;}
        .btn {padding:10px 18px;border-radius:20px;border:none;cursor:pointer;font-size:14px;font-weight:500;transition:0.3s;}
        .btn-save {background:#00e0ff;color:#000;}
        .btn-save:hover {background:#00bcd4;}
        .btn-exit {background:#ff4d4d;color:#fff;}
        .btn-exit:hover {background:#e60000;}
        .btn-history {background:#ffb400;color:#000;}
        .btn-history:hover {background:#e69500;}

        /* MAIN LAYOUT */
        .main {display:flex;flex:1;margin-top:15px;}
        .editor-container {flex:3;padding:25px;}
        textarea {width:100%;height:100%;resize:none;border-radius:15px;padding:20px;font-size:15px;border:none;outline:none;box-shadow:0 10px 25px rgba(0,0,0,0.3);}

        /* SIDEBAR */
        .sidebar {flex:1;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);padding:20px;border-radius:10px;}
        .sidebar h3 {margin-bottom:15px;font-weight:500;text-align:center;}
        .user {background:rgba(0,0,0,0.2);padding:10px;border-radius:10px;margin-bottom:10px;font-size:14px;text-align:center;}

        /* FOOTER */
        .footer {text-align:center;padding:10px;font-size:13px;background:rgba(0,0,0,0.2);margin-top:10px;border-radius:10px;}

        /* RESPONSIVE */
        @media (max-width:900px){
            .main{flex-direction:column;}
            .sidebar{order:-1;margin-bottom:20px;}
        }

    .typing-active {
  border: 2px solid #00ff9c !important;
  box-shadow: 0 0 12px rgba(0,255,156,0.7);
}

    </style>
</head>
<body>

    <div id="typing-indicator" style="
  position: fixed;
  bottom: 15px;
  left: 20px;
  background: #111;
  color: #fff;
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 14px;
  display: none;
  z-index: 9999;
">
</div>

<!-- HEADER -->
<div class="header">
    <h2>Editing Document: {{ doc_id }}</h2>
    <div class="actions">
        <button class="btn btn-save" onclick="saveDocument()">Save</button>
        <button class="btn btn-history" onclick="viewHistory()">History</button>
        <button class="btn btn-exit" onclick="exitEditor()">Exit</button>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <!-- EDITOR -->
    <div class="editor-container">
        <textarea id="editor" placeholder="Start typing here...">{{ content|safe }}</textarea>
    </div>

    <!-- COLLABORATORS -->
    <div class="sidebar">
        <h3>Active Collaborators</h3>
        <div id="users"></div>
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    Real-Time Collaborative Editor | MSc / MTech Final Project
</div>

<!-- SCRIPTS -->
<script>
    const socket = io();
    const editor = document.getElementById("editor");
    const usersDiv = document.getElementById("users");

    const DOC_ID = "{{ doc_id }}";
    const USER = "{{ user }}";

    // Join the document room
    socket.emit("join", { doc: DOC_ID, user: USER });

    // Send current content immediately to sync with other users
    socket.emit("edit", { doc: DOC_ID, content: editor.value, user: USER });

    // Listen for real-time updates
    socket.on("update", data => {
        if (data.user !== USER) {  // prevent overwriting own typing
            editor.value = data.content;
        }
    });

    // Update active collaborators
    socket.on("users", data => {
        usersDiv.innerHTML = "";
        data.forEach(u => {
            usersDiv.innerHTML += `<div class="user">${u}</div>`;
        });
    });

    // Save document
    function saveDocument() {
        fetch(`/save/${DOC_ID}`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "content=" + encodeURIComponent(editor.value)
        })
        .then(() => alert("Document saved successfully"))
        .catch(() => alert("Error saving document"));
    }

    // Exit editor
    function exitEditor() {
        window.location.href = "/dashboard";
    }

    // View version history
    function viewHistory() {
        window.location.href = `/history/${DOC_ID}`;
    }

    // Emit edits on typing
    // Emit edits + typing indicator
editor.addEventListener("keyup", () => {
    socket.emit("edit", { doc: DOC_ID, content: editor.value, user: USER });

    socket.emit("typing", { doc: DOC_ID, user: USER });

    clearTimeout(window.typingTimer);
    window.typingTimer = setTimeout(() => {
        socket.emit("stop_typing", { doc: DOC_ID, user: USER });
    }, 1200);
});
// Show typing indicator
socket.on("user_typing", data => {
    if (data.user !== USER) {
        const box = document.getElementById("typing-indicator");
        box.style.display = "block";
        box.innerText = data.user + " is typing...";
        editor.classList.add("typing-active");
    }
});

// Hide typing indicator
socket.on("user_stop_typing", data => {
    if (data.user !== USER) {
        const box = document.getElementById("typing-indicator");
        box.style.display = "none";
        box.innerText = "";
        editor.classList.remove("typing-active");
    }
});

</script>

</body>
</html>
