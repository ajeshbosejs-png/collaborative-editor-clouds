<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document History | {{ doc_id }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background: linear-gradient(135deg, #1d2671, #c33764);
            color:#fff;
            min-height:100vh;
            padding:30px;
        }

        h2{
            margin-bottom:25px;
            font-weight:600;
            text-align:center;
        }

        table{
            width:100%;
            border-collapse: collapse;
            background: rgba(255,255,255,0.12);
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 12px 30px rgba(0,0,0,0.35);
        }

        th, td{
            padding:16px;
            border-bottom:1px solid rgba(255,255,255,0.15);
        }

        th{
            background: rgba(0,0,0,0.35);
        }

        .buttons{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }

        .request-btn{
            background:#00e0ff;
            border:none;
            padding:8px 14px;
            border-radius:8px;
            color:#000;
            font-weight:600;
            cursor:pointer;
        }

        .compare-btn{
            background:#ffb400;
            padding:8px 14px;
            border-radius:8px;
            text-decoration:none;
            color:#000;
            font-weight:600;
        }

        a.back{
            display:inline-block;
            margin-top:25px;
            color:#ff4d4d;
            text-decoration:none;
        }
    </style>
</head>

<body>

<h2>Document History: {{ doc_id }}</h2>

<table>
    <thead>
        <tr>
            <th>Version Filename</th>
            <th>Timestamp</th>
            <th>Actions</th>
        </tr>
    </thead>

<tbody>
{% for v in versions %}
<tr>
    <td>{{ v.filename }}</td>
    <td>{{ v.timestamp }}</td>

    <td class="buttons">

        <!-- REQUEST RESTORE -->
        <button class="request-btn"
            onclick="sendRequest('{{ doc_id }}','{{ v.filename }}')">
            Request Restore
        </button>

        <!-- COMPARE -->
        {% if versions|length > 1 %}
        <a class="compare-btn"
           href="{{ url_for('compare_versions', doc_id=doc_id) }}?file1={{ v.filename }}&file2={{ versions[0].filename }}">
           Compare with latest
        </a>
        {% endif %}

    </td>
</tr>
{% endfor %}
</tbody>
</table>

<a class="back" href="{{ url_for('dashboard') }}">← Back to Dashboard</a>

<script>
function sendRequest(doc_id, filename){

    fetch("/request_restore", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            doc_id: doc_id,
            version_file: filename
        })
    })
    .then(res => res.text())   // <-- FIXED
    .then(data => {
        alert("✅ Restore request sent to admin!");
    })
    .catch(err => {
        alert("❌ Failed to send request");
        console.log(err);
    });
}
</script>

</body>
</html>
