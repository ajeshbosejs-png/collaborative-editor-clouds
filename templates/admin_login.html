<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | Collaborative Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* Login Card */
        .login-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 18px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 10px;
            font-weight: 600;
        }

        .login-card p {
            font-size: 14px;
            margin-bottom: 25px;
            opacity: 0.85;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            font-size: 13px;
            margin-bottom: 6px;
            display: block;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: none;
            background: #00e0ff;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #00bcd4;
        }

        /* Footer Links */
        .footer-links {
            margin-top: 20px;
            font-size: 13px;
        }

        .footer-links a {
            color: #00e0ff;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

<div class="login-card">
    <h2>Admin Login</h2>
    <p>Authorized administrators only</p>

    <form method="POST" action="/admin/login">
        <div class="input-group">
            <label>Admin Username</label>
            <input type="text" name="username" required>
        </div>

        <div class="input-group">
            <label>Admin Password</label>
            <input type="password" name="password" required>
        </div>

        <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="footer-links">
        <a href="/">← Back to Home</a>
    </div>
</div>

</body>
</html>
